name: Polyai
description: >-
  PolyAI builds enterprise-grade voice and chat AI agents that handle real
  customer service conversations across 24+ languages, with 99.994% production
  uptime. The PolyAI Platform exposes three REST API families — an Agents API to
  create, branch, configure and deploy agents through environments; a
  Conversations API to retrieve transcripts, audio, metrics and session data;
  and a Webhooks & Alerts surface for real-time event notifications — plus Chat,
  SMS, Outbound Calling, Handoff, DNI, External Events, Messaging (WebSocket) and
  a WebRTC Gateway. Authentication is header-based (x-api-key) with region-scoped
  keys, and a Python Agent Development Kit (ADK) offers a Git-like local
  build-pull-push workflow. Backed by Khosla Ventures and profiled in the API
  Evangelist network.
