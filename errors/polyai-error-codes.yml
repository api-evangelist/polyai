generated: '2026-07-20'
method: searched
source: https://docs.poly.ai/api-reference/error-codes
format: proprietary-envelope
notes: >-
  PolyAI does NOT use RFC 9457 problem+json. Errors return a JSON envelope with
  fields: success (always false), error (human message), error_id (from the
  X-PolyAI-Correlation-Id response header), error_code (UPPER_SNAKE_CASE
  machine code), error_message (human description), data (always null).
envelope:
  fields:
  - name: success
    value: 'false on error'
  - name: error
    description: Human-readable message
  - name: error_id
    description: Unique request identifier, echoes X-PolyAI-Correlation-Id header
  - name: error_code
    description: Machine-readable code in UPPER_SNAKE_CASE
  - name: error_message
    description: Human-readable description
  - name: data
    value: 'null on error'
http_status_codes:
- {status: 400, meaning: Bad request, remediation: Validate request body and query parameters}
- {status: 401, meaning: Unauthorized, remediation: Verify API key presence and validity}
- {status: 403, meaning: Forbidden, remediation: Confirm user permissions for the action}
- {status: 404, meaning: Not found, remediation: Check resource ID exists and region is correct}
- {status: 405, meaning: Method not allowed, remediation: Use correct HTTP verb for endpoint}
- {status: 408, meaning: Request timeout, remediation: Retry; reduce payload complexity if recurring}
- {status: 409, meaning: Conflict, remediation: Use different identifier; check for duplicates}
- {status: 410, meaning: Gone, remediation: Resource permanently deleted; cannot recover}
- {status: 412, meaning: Precondition failed, remediation: Deploy to pre-release environment first}
- {status: 415, meaning: Unsupported media type, remediation: Upload supported file type only}
- {status: 422, meaning: Unprocessable entity, remediation: Fix semantic errors (e.g. CSV schema mismatch)}
- {status: 429, meaning: Too many requests, remediation: Respect rate limits; retry after header delay}
- {status: 500, meaning: Internal server error, remediation: Retry or contact support}
- {status: 501, meaning: Not implemented, remediation: Feature unavailable; check roadmap}
- {status: 502, meaning: Bad gateway, remediation: Upstream service error; retry}
- {status: 503, meaning: Service unavailable, remediation: Temporary outage; retry later}
